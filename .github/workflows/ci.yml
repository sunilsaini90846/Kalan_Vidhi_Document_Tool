name: Kalan Vidhi Doc Tool CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm audit --omit=dev
      # The site URL defaults to https://doctool.kalanvidhi.com in src/config/brand.ts; the repository variable SITE_URL
      # is only an optional override (an unset variable arrives here as an empty string, which means "use the default").
      - run: npm run build
        env:
          VITE_SITE_URL: ${{ vars.SITE_URL }}
      # Fails the job when sitemap.xml, robots.txt, 404.html, canonicals or structured data are missing or wrong.
      - run: npm run verify:seo
        env:
          VITE_SITE_URL: ${{ vars.SITE_URL }}
      - run: npx playwright install --with-deps chromium
      # E2E_PREBUILT: serve the build verified above. Playwright must not rebuild dist, which is what gets deployed.
      - run: npm run e2e
        env:
          E2E_PREBUILT: '1'
          VITE_SITE_URL: ${{ vars.SITE_URL }}
      # Proves the e2e run left the artifact intact before it is uploaded.
      - run: npm run verify:seo
        env:
          VITE_SITE_URL: ${{ vars.SITE_URL }}
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          retention-days: 7
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist
          retention-days: 1

  # Deploys only from main, only after tests pass, and only when Firebase is configured.
  # Needs repository secret FIREBASE_SERVICE_ACCOUNT and variable FIREBASE_PROJECT_ID.
  deploy:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.FIREBASE_PROJECT_ID != ''
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      # Last gate before production: the artifact being deployed must carry the production URL everywhere.
      - run: npm run verify:seo -- --production
        env:
          VITE_SITE_URL: ${{ vars.SITE_URL }}
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          projectId: ${{ vars.FIREBASE_PROJECT_ID }}
          channelId: live
      # Read-only check of what is now live (GET requests only). A failure here means: roll back in the Firebase console.
      - run: npm run verify:seo -- https://doctool.kalanvidhi.com --no-dist --production
